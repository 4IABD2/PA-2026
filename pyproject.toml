[project]
name = "pa-2026"
version = "0.1.0"
description = "Voiture autonome dans CARLA - projet annuel 4IABD2"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "matplotlib==3.10.8",
    "tensorflow",
    "numpy",
    "pandas",
    "Pillow",
    "fiftyone>=1.0.0",
    "ultralytics>=8.4.51",
    "easyocr>=1.7.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "opencv-python-headless>=4.9",
    "carla==0.9.16",
]

[dependency-groups]
dev = [
    "black",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "smoke.py"]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ["py310"]
