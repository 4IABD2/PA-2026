[project]
name = "pa-2026"
version = "0.1.0"
description = "Voiture autonome dans CARLA - projet annuel 4IABD2"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "matplotlib==3.10.8",
    "tensorflow",
    "numpy",
    "pandas",
    "Pillow",
    "fiftyone>=1.0.0",
    "ultralytics>=8.4.51",
    "easyocr>=1.7.2",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "opencv-python-headless>=4.9",
    "carla==0.9.16",
    "transformers>=5.9.0",
    "torch>=2.7",
    "torchvision>=0.22",
    "pygame>=2.5",
    "pybind11>=3.0.4",
]

[dependency-groups]
dev = [
    "black",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
python_files = ["test_*.py", "smoke.py"]
pythonpath = ["."]

# PyTorch CUDA 12.8 (cu128) pour les GPU NVIDIA Blackwell (RTX 50xx, sm_120) sur
# Windows/Linux. Sur macOS, pas de wheel CUDA → on retombe sur PyPI (CPU/MPS).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.black]
line-length = 88
target-version = ["py310"]

[build-system]
requires = ["setuptools", "pybind11"]
build-backend = "setuptools.build_meta"

